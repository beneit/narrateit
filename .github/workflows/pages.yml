# Publishes the static NarrateIt demo (index.html + web_samples/) to GitHub Pages.
# Only these files are deployed; the Python package is never part of the site.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - web_samples/**
      - .github/workflows/pages.yml
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r web_samples _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
